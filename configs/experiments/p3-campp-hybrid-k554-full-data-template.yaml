_meta: {name: p3-campp-hybrid-k554-full-data-template, base: default_config.yaml}
experiment:
  priority: P3
  family: final-retrain
  status: template_requires_oof_epoch
  purpose: Final all-usable-data retrain after P0 OOF model selection
data: {clean_duplicates: true, split: {scheme: full, folds: 3, fold: 0, seed: 42}}
model:
  encoder_type: campp
  num_unknown_clusters: 554
  unknown_cluster_path: data/processed/unknown_clusters_full.json
  ood_head: true
  speaker_head_type: arcface
  encoder_config: {campp: {freeze_encoder: false, unfreeze_last_n_blocks: 2}}
audio: {num_train_windows: 8, speech_aware_crop_probability: 0.75, eval_speech_aware: true}
training:
  # Replace 100 with the robust OOF-derived epoch before launching.
  epochs: 100
  selection_mode: last_epoch
  freeze_epochs: 20
  early_stopping_patience: 0
  encoder_lr: 1.0e-05
  loss:
    speaker: {type: ce, label_smoothing: 0.05, weight: 0.8}
    ood: {type: bce, pos_weight: 1.0, weight: 0.15}
    proto: {enabled: true, scope: metric, weight: 0.05, scale: 30.0, margin: 0.2, decay: 0.9}
