_meta: {name: p2-ecapa-hybrid-k554-oof-f0, base: default_config.yaml}
experiment: {priority: P2, family: diversity, purpose: Train a complementary encoder for CAM++ ensemble}
data: {clean_duplicates: true, split: {scheme: kfold, folds: 3, fold: 0, seed: 42}}
model:
  encoder_type: ecapa
  num_unknown_clusters: 554
  unknown_cluster_path: data/processed/unknown_clusters_oof_f0.json
  ood_head: true
  speaker_head_type: arcface
  encoder_config: {ecapa: {freeze_encoder: false, unfreeze_last_n_blocks: 2, pooling_type: identity}}
audio: {num_train_windows: 8, speech_aware_crop_probability: 0.75, eval_speech_aware: true}
training:
  epochs: 200
  freeze_epochs: 15
  early_stopping_patience: 20
  encoder_lr: 5.0e-06
  loss:
    speaker: {type: ce, label_smoothing: 0.05, weight: 0.8}
    ood: {type: bce, pos_weight: 1.0, weight: 0.15}
    proto: {enabled: true, scope: metric, weight: 0.05, scale: 30.0, margin: 0.2, decay: 0.9}
