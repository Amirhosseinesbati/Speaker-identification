    selected_epoch: 65
    raw_macro_f1: 0.9258302229315528
    known_accuracy: 0.9383408071748879
    ood_f1: 0.9270620313565099
    logit_macro_f1: 0.9170680134940363
    ema_macro_f1: 0.9208233951005929
