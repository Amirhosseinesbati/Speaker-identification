_meta:
  name: p7-campp-known446-ood-cleanaug-oodjsd-control-lmft-oof-f0
  base: default_config.yaml
experiment:
  priority: P7-OOD-JSD-MATCHED-CONTROL
  family: campp-known446-ood-head-cleanaug-jsd-ablation
  purpose: >-
    Source-matched Fold-0 control for binary OOD-head clean/aug JSD. It runs
    the identical paired-view computation as treatment with multiplier zero.
  activation_condition: >-
    Only after P6 is terminally rejected with complete provenance, no run is
    active, and at least 1.10 USD remains for the complete matched pair.
  adaptive_horizon:
    maximum_epochs: 60
    selection_metric: raw_probability_average_macro_f1
    early_stopping_start_epoch: 20
    patience: 12
  stop_rules:
    maximum_runtime_hours: 3.0
    maximum_incremental_cost_usd: 0.52
    immediate:
      [nan, provenance_mismatch, artifact_corruption, second_oom, nonfinite_jsd]
data:
  clean_duplicates: true
  split: {scheme: kfold, folds: 3, fold: 0, seed: 42}
model:
  encoder_type: campp
  competition_num_known: 446
  num_unknown_clusters: 554
  unknown_cluster_path: data/processed/unknown_clusters_oof_f0.json
  speaker_target_scope: known
  ood_head: true
  speaker_head_type: arcface
  speaker_head_config:
    arcface: {embedding_dim: 192, margin: 0.4, scale: 30.0}
  encoder_config:
    campp: {freeze_encoder: true, unfreeze_last_n_blocks: 0}
audio:
  num_train_windows: 8
  ood_batch_ratio: 0.5
  speech_aware_crop_probability: 0.75
  eval_speech_aware: true
  short_audio_mode: pad
hardware:
  mode: vastai_3090_campp
  profiles:
    vastai_3090_campp:
      batch_size: 48
      description: Measured RTX 3090 OOD-head-only paired-view adaptation
      device: cuda
      mixed_precision: true
      num_workers: 8
logging:
  checkpoint_dir: checkpoints/p7-campp-known446-ood-cleanaug-oodjsd-control-lmft-oof-f0
  log_dir: logs/p7-campp-known446-ood-cleanaug-oodjsd-control-lmft-oof-f0
training:
  seed: 42
  deterministic_algorithms: true
  warm_start_checkpoint: checkpoints/p0-campp-known446-ood-control-oof-f0/campp_best_raw.pt
  selection_variant: raw
  ood_head_only: true
  epochs: 60
  freeze_epochs: 0
  early_stopping_start_epoch: 20
  early_stopping_patience: 12
  learning_rate: 5.0e-05
  encoder_lr: 5.0e-05
  weight_decay: 0.0001
  schedule: cosine
  warmup_ratio: 0.05
  min_lr_ratio: 0.05
  ema_enabled: true
  ema_decay: 0.999
  loss:
    speaker:
      type: ce
      label_smoothing: 0.05
      weight: 0.85
      inter_class:
        enabled: false
        type: exclusive_angular_energy
        weight: 0.01
    ood:
      type: bce
      pos_weight: 1.0
      weight: 0.15
      clean_aug_jsd:
        enabled: true
        type: target_clean_aug_bernoulli_jsd
        weight: 0.0
    proto: {enabled: false}
    consistency: {enabled: false, type: cosine, weight: 0.1, pairing: clean_aug}
