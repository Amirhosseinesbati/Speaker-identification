_meta: {name: p1-campp-hybrid-no-proto-oof-f0, base: default_config.yaml}
experiment: {priority: P1, family: loss-ablation, purpose: Measure prototype-loss value without changing the hybrid targets}
data: {clean_duplicates: true, split: {scheme: kfold, folds: 3, fold: 0, seed: 42}}
model:
  encoder_type: campp
  num_unknown_clusters: 554
  unknown_cluster_path: data/processed/unknown_clusters_oof_f0.json
  ood_head: true
  speaker_head_type: arcface
  encoder_config: {campp: {freeze_encoder: false, unfreeze_last_n_blocks: 2}}
audio: {num_train_windows: 8, speech_aware_crop_probability: 0.75, eval_speech_aware: true}
training:
  epochs: 200
  freeze_epochs: 20
  early_stopping_patience: 20
  encoder_lr: 1.0e-05
  loss:
    speaker: {type: ce, label_smoothing: 0.05, weight: 0.85}
    ood: {type: bce, pos_weight: 1.0, weight: 0.15}
    proto: {enabled: false}
