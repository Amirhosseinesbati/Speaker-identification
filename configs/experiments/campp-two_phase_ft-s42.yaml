_meta:
  name: campp-two_phase_ft-s42
  base: default_config.yaml
  created: '2026-08-19T16:48:55'
  base_git: 8e35aa6
audio:
  num_train_windows: 8
augmentation:
  domain:
    mp3_codec_roundtrip:
      p: 0.5
    musan:
      music_p: 0.5
      noise_p: 0.8
      snr_db:
      - 0.0
      - 15.0
    rirs_reverb:
      p: 0.6
  waveform:
    time_stretch:
      p: 0.9
      rate:
      - 0.9
      - 1.1
data:
  split:
    scheme: single
model:
  encoder_config:
    eres2net:
      freeze_encoder: false
  encoder_type: eres2net
  ood_head_config:
    hidden_dim: 300
  speaker_head_config:
    arcface_subcenter:
      embedding_dim: 256
training:
  encoder_lr: 1.0e-05
  freeze_epochs: 20
  label_smoothing: 0.1
  loss:
    proto:
      enabled: true
      weight: 0.2
    speaker:
      label_smoothing: 0.1
  schedule: cosine_warm_restarts
  weight_decay: 0.0003
