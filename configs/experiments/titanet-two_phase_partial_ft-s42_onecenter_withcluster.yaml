_meta:
  name: titanet-two_phase_partial_ft-s42_onecenter_withcluster
  base: default_config.yaml
  created: '2026-08-22T14:00:00'
  base_git: ee67462
# Clone of the campp winner (campp-two_phase_partial_ft-s42_onecenter_withcluster)
# with the encoder swapped to TitaNet-Large. TitaNet has NO unfreeze_last_n_blocks
# support in src/encoders.py → encoder stays FROZEN (head-only fine-tune, like the
# legacy titanet recipe). Single-center ArcFace m=0.3/s=32, closed-set 1000-class
# clustering. Goal: a cluster-trained TitaNet for the 4-encoder ensemble.
audio:
  num_train_windows: 8
augmentation:
  domain:
    mp3_codec_roundtrip:
      p: 0.5
    musan:
      music_p: 0.5
      noise_p: 0.8
      snr_db:
      - 0.0
      - 15.0
    rirs_reverb:
      p: 0.6
  waveform:
    time_stretch:
      p: 0.9
      rate:
      - 0.9
      - 1.1
data:
  split:
    scheme: single
model:
  num_unknown_clusters: 554
  ood_head: false
  encoder_config:
    titanet:
      freeze_encoder: true
  encoder_type: titanet
  speaker_head_config:
    arcface:
      margin: 0.3
      scale: 32.0
  speaker_head_type: arcface
training:
  encoder_lr: 1.0e-05
  early_stopping_patience: 0
  freeze_epochs: 30
  label_smoothing: 0.1
  loss:
    speaker:
      label_smoothing: 0.1
  weight_decay: 0.0003