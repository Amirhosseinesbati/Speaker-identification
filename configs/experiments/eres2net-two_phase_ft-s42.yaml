_meta:
  name: eres2net-two_phase_ft-s42
  base: default_config.yaml
  created: '2026-08-18T19:00:18'
  base_git: 436baac
audio:
  num_train_windows: 8
augmentation:
  domain:
    mp3_codec_roundtrip:
      p: 0.5
    musan:
      music_p: 0.5
      noise_p: 0.8
      snr_db:
      - 0.0
      - 15.0
    rirs_reverb:
      p: 0.6
  waveform:
    time_stretch:
      p: 0.9
      rate:
      - 0.9
      - 1.1
data:
  split:
    scheme: single
model:
  encoder_config:
    eres2net:
      freeze_encoder: false
  encoder_type: eres2net
training:
  encoder_lr: 1.0e-05
  freeze_epochs: 20
  label_smoothing: 0.1
  loss:
    speaker:
      label_smoothing: 0.1
  weight_decay: 0.0003
