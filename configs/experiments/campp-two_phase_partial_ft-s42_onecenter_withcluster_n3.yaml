_meta:
  name: campp-two_phase_partial_ft-s42_onecenter_withcluster_n3
  base: default_config.yaml
  created: '2026-08-20T13:12:05'
  base_git: ee67462
audio:
  num_train_windows: 8
augmentation:
  domain:
    mp3_codec_roundtrip:
      p: 0.5
    musan:
      music_p: 0.5
      noise_p: 0.8
      snr_db:
      - 0.0
      - 15.0
    rirs_reverb:
      p: 0.6
  waveform:
    time_stretch:
      p: 0.9
      rate:
      - 0.9
      - 1.1
data:
  split:
    scheme: single
model:
  num_unknown_clusters: 554
  ood_head: false
  encoder_config:
    campp:
      unfreeze_last_n_blocks: 3
  speaker_head_config:
    arcface:
      margin: 0.3
      scale: 32.0
  speaker_head_type: arcface
training:
  encoder_lr: 1.0e-05
  early_stopping_patience: 0
  freeze_epochs: 30
  label_smoothing: 0.1
  loss:
    speaker:
      label_smoothing: 0.1
  weight_decay: 0.0003
