hardware:
  mode: local
  profiles:
    local:
      description: GTX 1660 Ti (6GB VRAM)
      device: cuda
      batch_size: 8
      num_workers: 2
      mixed_precision: true
    vastai:
      description: RTX 3090 / 4090 / A5000 (24GB+ VRAM)
      device: cuda
      batch_size: 32
      num_workers: 4
      mixed_precision: true
    vastai_3060:
      description: RTX 3060 (12GB VRAM)
      device: cuda
      batch_size: 16
      num_workers: 4
      mixed_precision: true
audio:
  sample_rate: 16000
  duration_seconds: 3.0
  n_mels: 80
  n_fft: 400
  hop_length: 160
model:
  base_model: microsoft/wavlm-base-plus
  freeze_feature_extractor: true
  embedding_dim: 768
training:
  epochs: 20
  learning_rate: 0.0001
  weight_decay: 1.0e-05
  warmup_steps: 500
  max_grad_norm: 5.0
data:
  labels_path: data/raw/labels.csv
  audio_dir: data/raw
  processed_labels: data/processed/cleaned_labels.csv
logging:
  log_dir: logs
  checkpoint_dir: checkpoints

# ─────────────────────────────────────────────────────
# MLOps Configuration (ZenML + MLflow + DagsHub)
# ─────────────────────────────────────────────────────
mlops:
  enabled: true
  experiment_name: speaker-identification
  pipeline_name: speaker_id_pipeline
  tracking:
    uri: "https://dagshub.com/amiresbati52/Speaker-identification.mlflow"
    username: "${DAGSHUB_REPO_OWNER}"
    password: "${DAGSHUB_USER_TOKEN}"
  model_registry:
    type: mlflow
    name: speaker-identification
  artifact_store:
    type: local
    path: data/artifacts
  vast:
    default_gpu: "RTX_3090"
    alternative_gpu: "RTX_3060"
    disk_size: 40
    image: "pytorch/pytorch:2.2.0-cuda12.1-cudnn8-devel"
