audio:
  duration_seconds: 8.0
  eval_hop_ratio: 0.5
  hop_length: 160
  max_eval_windows: 8
  min_valid_duration: 1.0
  n_fft: 400
  n_mels: 80
  num_train_windows: 4
  ood_batch_ratio: 0.35
  sample_rate: 16000
augmentation:
  waveform:
    gaussian_noise:
      p: 0.4
      amp: [0.001, 0.012]
    gain:
      p: 0.3
      db: [-6, 6]
    polarity_inversion:
      p: 0.5
    shift:
      p: 0.3
      frac: 0.1
    pitch_shift:
      p: 0.25
      semitones: [-1, 1]
    time_stretch:
      p: 0.2
      rate: [0.85, 1.18]
  domain:
    rirs_reverb:
      p: 0.4
      path: data/augmentation/rirs
    musan:
      noise_p: 0.4
      music_p: 0.2
      snr_db: [5, 20]
      path: data/augmentation/musan
    mp3_codec_roundtrip:
      p: 0.3
      min_bitrate: 64
      max_bitrate: 192
  spec:
    time_mask:
      p: 0.5
      max_mask_ratio: 0.2
data:
  audio_dir: data\processed\audio_wav
  labels_path: data\processed\audio_wav_labels.csv
  processed_labels: data/processed/cleaned_labels.csv
  split:
    scheme: single
    folds: 3
    fold: 0
hardware:
  mode: local
  profiles:
    local:
      batch_size: 8
      description: GTX 1660 Ti (6GB VRAM)
      device: cuda
      mixed_precision: true
      num_workers: 0
    vastai:
      batch_size: 32
      description: RTX 3090 / 4090 / A5000 (24GB+ VRAM)
      device: cuda
      mixed_precision: true
      num_workers: 4
    vastai_3060:
      batch_size: 16
      description: RTX 3060 (12GB VRAM)
      device: cuda
      mixed_precision: true
      num_workers: 4
    vastai_a4000:
      batch_size: 24
      description: RTX A4000 (16GB VRAM)
      device: cuda
      mixed_precision: true
      num_workers: 4
logging:
  checkpoint_dir: checkpoints
  log_dir: logs
mlops:
  artifact_store:
    path: data/artifacts
    type: local
  enabled: true
  experiment_name: speaker-identification
  model_registry:
    name: speaker-identification
    type: mlflow
  pipeline_name: speaker_id_pipeline
  tracking:
    password: ${DAGSHUB_USER_TOKEN}
    uri: https://dagshub.com/amiresbati52/Speaker-identification.mlflow
    username: ${DAGSHUB_REPO_OWNER}
  vast:
    alternative_gpu: RTX_3060
    default_gpu: RTX_3090
    disk_size: 60
    gpu_options:
    - RTX_3090
    - RTX_3060
    - RTX_A4000
    image: pytorch/pytorch:2.2.0-cuda12.1-cudnn8-devel
model:
  competition_num_known: 446
  allow_hub_download: false
  encoder_config:
    ecapa:
      freeze_encoder: false
      source: speechbrain/spkrec-ecapa-voxceleb
      unfreeze_last_n_blocks: 0
      local_path: weights/ecapa
      pooling_type: identity
    wavlm:
      base_model: microsoft/wavlm-large
      freeze_feature_extractor: true
      local_path: weights/wavlm_large
      pooling_type: statistical
    campp:
      model_id: iic/speech_campplus_sv_en_voxceleb_16k
      revision: v1.0.2
      freeze_encoder: false
      local_path: weights/campp
      pooling_type: identity
    eres2net:
      ckpt_name: eres2netv2.ckpt
      freeze_encoder: true
      local_path: weights/eres2net
      pooling_type: identity
    titanet:
      model_id: nvidia/speakerverification_en_titanet_large
      freeze_encoder: true
      local_path: weights/titanet/titanet_large.nemo
      pooling_type: identity
  encoder_type: campp
  fusion:
    ensemble_method: none
  ood_head_config:
    hidden_dim: 256
  pooling_type: identity
  speaker_head_config:
    arcface:
      embedding_dim: 192
      margin: 0.4
      scale: 30.0
    arcface_subcenter:
      embedding_dim: 192
      margin: 0.3
      scale: 32.0
      sub_centers: 3
    linear:
      hidden_dims: []
  speaker_head_type: arcface_subcenter
training:
  early_stopping_patience: 15
  encoder_lr: 3.0e-05
  epochs: 200
  label_smoothing: 0.05
  learning_rate: 0.0003
  max_grad_norm: 5.0
  ood_grad_norm: 1.0
  ood_loss_weight: 0.15
  ood_pos_weight: 1.0
  speaker_loss_weight: 0.85
  weight_decay: 1.0e-04
  schedule: cosine
  warmup_ratio: 0.10
  min_lr_ratio: 0.05
  amp_dtype: bf16
  ema_enabled: true
  ema_decay: 0.999
  loss:
    speaker:
      type: ce
      focal_gamma: 2.0
      label_smoothing: 0.05
      weight: 0.85
    ood:
      type: bce
      pos_weight: 1.0
      weight: 0.15
