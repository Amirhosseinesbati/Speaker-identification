hardware:
  mode: local
  profiles:
    local:
      description: GTX 1660 Ti (6GB VRAM)
      device: cuda
      batch_size: 8
      num_workers: 0
      mixed_precision: true
    vastai:
      description: RTX 3090 / 4090 / A5000 (24GB+ VRAM)
      device: cuda
      batch_size: 32
      num_workers: 4
      mixed_precision: true
    vastai_3060:
      description: RTX 3060 (12GB VRAM)
      device: cuda
      batch_size: 16
      num_workers: 4
      mixed_precision: true
audio:
  sample_rate: 16000
  duration_seconds: 8.0
  min_valid_duration: 1.0
  ood_batch_ratio: 0.30            # Target OOD fraction per batch
  num_train_windows: 3             # Random crops per file in train (multi-window TTA)
  eval_hop_ratio: 0.5              # Sliding-window overlap for eval/inference
  max_eval_windows: 8              # Cap on eval windows per file
  n_mels: 80
  n_fft: 400
  hop_length: 160
model:
  encoder_type: ecapa
  competition_num_known: 446      # Competition spec: 446 known speakers → 447-class output
  encoder_config:
    wavlm:
      base_model: microsoft/wavlm-base-plus
      freeze_feature_extractor: true
    ecapa:
      source: speechbrain/spkrec-ecapa-voxceleb
      freeze_encoder: true
    hubert:
      base_model: facebook/hubert-large-ls960-ft
      freeze_feature_extractor: true
  pooling_type: identity
  speaker_head_type: arcface
  speaker_head_config:
    arcface:
      embedding_dim: 192
      margin: 0.4                 # 0.3→0.4 — stronger angular separation
      scale: 30.0                 # 15→30 — standard for speaker recognition
    linear:
      hidden_dims: []
  ood_head_config:
    hidden_dim: 256
  fusion:
    ensemble_method: none
training:
  epochs: 50
  learning_rate: 0.0001
  weight_decay: 1.0e-05
  warmup_steps: 500
  max_grad_norm: 5.0
  ood_grad_norm: 1.0              # Tighter clip for OOD head (prevents overfitting)
  ood_loss_weight: 0.3            # Speaker loss 3× more important than OOD
  speaker_loss_weight: 0.7
  early_stopping_patience: 10     # Stop if val_loss doesn't improve for N epochs
  label_smoothing: 0.1            # Label smoothing for speaker classification
data:
  labels_path: data/processed/audio_wav_labels.csv
  audio_dir: data/processed/audio_wav
  processed_labels: data/processed/cleaned_labels.csv
logging:
  log_dir: logs
  checkpoint_dir: checkpoints
mlops:
  enabled: true
  experiment_name: speaker-identification
  pipeline_name: speaker_id_pipeline
  tracking:
    uri: https://dagshub.com/amiresbati52/Speaker-identification.mlflow
    username: ${DAGSHUB_REPO_OWNER}
    password: ${DAGSHUB_USER_TOKEN}
  model_registry:
    type: mlflow
    name: speaker-identification
  artifact_store:
    type: local
    path: data/artifacts
  vast:
    default_gpu: RTX_3090
    alternative_gpu: RTX_3060
    disk_size: 60
    image: pytorch/pytorch:2.2.0-cuda12.1-cudnn8-devel
