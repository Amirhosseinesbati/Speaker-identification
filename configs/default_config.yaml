hardware:
  mode: local
  profiles:
    local:
      description: GTX 1660 Ti (6GB VRAM)
      device: cuda
      batch_size: 8
      num_workers: 0
      mixed_precision: true
    vastai:
      description: RTX 3090 / 4090 / A5000 (24GB+ VRAM)
      device: cuda
      batch_size: 32
      num_workers: 4
      mixed_precision: true
    vastai_3060:
      description: RTX 3060 (12GB VRAM)
      device: cuda
      batch_size: 16
      num_workers: 4
      mixed_precision: true
    vastai_a4000:
      description: RTX A4000 (16GB VRAM)
      device: cuda
      batch_size: 24
      num_workers: 4
      mixed_precision: true
audio:
  sample_rate: 16000
  duration_seconds: 8.0
  min_valid_duration: 1.0
  ood_batch_ratio: 0.5
  num_train_windows: 3
  eval_hop_ratio: 0.5
  max_eval_windows: 8
  n_mels: 80
  n_fft: 400
  hop_length: 160
model:
  encoder_type: ecapa
  competition_num_known: 446
  encoder_config:
    wavlm:
      base_model: microsoft/wavlm-base-plus
      freeze_feature_extractor: true
    ecapa:
      source: speechbrain/spkrec-ecapa-voxceleb
      freeze_encoder: false
      unfreeze_last_n_blocks: 2
    hubert:
      base_model: facebook/hubert-large-ls960-ft
      freeze_feature_extractor: true
  pooling_type: identity
  speaker_head_type: arcface
  speaker_head_config:
    arcface:
      embedding_dim: 192
      margin: 0.4
      scale: 30.0
    linear:
      hidden_dims: []
  ood_head_config:
    hidden_dim: 256
  fusion:
    ensemble_method: none
training:
  epochs: 100
  learning_rate: 0.0001
  encoder_lr: 1.0e-05
  weight_decay: 1.0e-05
  warmup_steps: 500
  max_grad_norm: 5.0
  ood_grad_norm: 1.0
  ood_pos_weight: 1.0
  ood_loss_weight: 0.3
  speaker_loss_weight: 0.7
  early_stopping_patience: 15
  label_smoothing: 0.1
data:
  labels_path: data/processed/audio_wav_labels.csv
  audio_dir: data/processed/audio_wav
  processed_labels: data/processed/cleaned_labels.csv
logging:
  log_dir: logs
  checkpoint_dir: checkpoints
mlops:
  enabled: true
  experiment_name: speaker-identification
  pipeline_name: speaker_id_pipeline
  tracking:
    uri: https://dagshub.com/amiresbati52/Speaker-identification.mlflow
    username: ${DAGSHUB_REPO_OWNER}
    password: ${DAGSHUB_USER_TOKEN}
  model_registry:
    type: mlflow
    name: speaker-identification
  artifact_store:
    type: local
    path: data/artifacts
  vast:
    default_gpu: RTX_3090
    alternative_gpu: RTX_3060
    # All GPU targets supported by the Vast.ai deploy path (deploy_app dropdown
    # must stay in sync): 3090 → vastai (batch 32), 3060 → vastai_3060 (16),
    # A4000 (16GB) → vastai_a4000 (batch 24).
    gpu_options:
      - RTX_3090
      - RTX_3060
      - RTX_A4000
    disk_size: 60
    image: pytorch/pytorch:2.2.0-cuda12.1-cudnn8-devel
