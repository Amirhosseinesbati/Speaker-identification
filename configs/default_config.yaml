audio:
  duration_seconds: 8.0
  eval_hop_ratio: 0.5
  hop_length: 160
  max_eval_windows: 8
  min_valid_duration: 1.0
  n_fft: 400
  n_mels: 80
  num_train_windows: 8
  ood_batch_ratio: 0.35
  sample_rate: 16000
  # Shared train/submission window policy. Defaults preserve legacy behaviour;
  # named experiments enable speech-aware variants explicitly.
  speech_aware_crop_probability: 0.0
  eval_speech_aware: false
  speech_relative_db: 35.0
  short_audio_mode: pad
augmentation:
  domain:
    mp3_codec_roundtrip:
      max_bitrate: 192
      min_bitrate: 64
      p: 0.3
    musan:
      music_p: 0.2
      noise_p: 0.4
      path: data/augmentation/musan
      snr_db:
      - 5.0
      - 20.0
    rirs_reverb:
      p: 0.4
      path: data/augmentation/rirs
  spec:
    time_mask:
      max_mask_ratio: 0.2
      p: 0.5
  waveform:
    gain:
      db:
      - -6.0
      - 6.0
      p: 0.3
    gaussian_noise:
      amp:
      - 0.001
      - 0.012
      p: 0.4
    pitch_shift:
      p: 0.25
      semitones:
      - -1.0
      - 1.0
    polarity_inversion:
      p: 0.5
    shift:
      frac: 0.1
      p: 0.3
    time_stretch:
      p: 0.2
      rate:
      - 0.85
      - 1.18
data:
  clean_duplicates: true
  audio_dir: data/processed/audio_wav
  labels_path: data/processed/audio_wav_labels.csv
  processed_labels: data/processed/cleaned_labels.csv
  split:
    fold: 0
    folds: 3
    scheme: kfold
    seed: 42
hardware:
  mode: local
  profiles:
    local:
      batch_size: 8
      description: GTX 1660 Ti (6GB VRAM)
      device: cuda
      mixed_precision: true
      num_workers: 0
    vastai:
      batch_size: 64
      description: RTX 3090 / 4090 / A5000 (24GB+ VRAM)
      device: cuda
      mixed_precision: true
      num_workers: 4
    vastai_3060:
      batch_size: 16
      description: RTX 3060 (12GB VRAM)
      device: cuda
      mixed_precision: true
      num_workers: 4
    vastai_3090_campp:
      batch_size: 48
      description: Measured RTX 3090 CAM++ 8x8s sweet spot (10%+ VRAM headroom)
      device: cuda
      mixed_precision: true
      num_workers: 8
    vastai_a4000:
      batch_size: 24
      description: RTX A4000 (16GB VRAM)
      device: cuda
      mixed_precision: true
      num_workers: 4
logging:
  checkpoint_dir: checkpoints
  log_dir: logs
mlops:
  artifact_store:
    path: data/artifacts
    type: local
  enabled: true
  experiment_name: speaker-identification
  model_registry:
    name: speaker-identification
    type: mlflow
  pipeline_name: speaker_id_pipeline
  tracking:
    password: ${DAGSHUB_USER_TOKEN}
    uri: https://dagshub.com/amiresbati52/Speaker-identification.mlflow
    username: ${DAGSHUB_REPO_OWNER}
  vast:
    alternative_gpu: RTX_3060
    default_gpu: RTX_3090
    disk_size: 60
    gpu_options:
    - RTX_3090
    - RTX_3060
    - RTX_A4000
    image: pytorch/pytorch:2.2.0-cuda12.1-cudnn8-devel
    min_cuda_version: 13
    # Server-selection gates (src/deploy/offer_selector.py). All default to
    # 0 / "" = NO filtering — the search takes whatever the market has and the
    # score (reliability → internet → CPU → price) picks the best of it. Raise
    # a gate here or in the UI to exclude machines below the bar.
    selector:
      pool_size: 50            # top-N cheapest candidates fetched from the API
      retry_count: 3           # how many of the ranked pool to try renting
      min_reliability: 0       # host uptime health (0..1) — min only
      min_inet_down_mbps: 0    # download MB/s (0 = open)
      max_inet_down_mbps: 0
      min_inet_up_mbps: 0      # upload MB/s
      max_inet_up_mbps: 0
      min_cpu_cores: 0         # advertised vCPUs
      max_cpu_cores: 0
      min_cpu_ram_gb: 0        # host RAM (GB)
      max_cpu_ram_gb: 0
      min_disk_gb: 0           # free disk space (GB)
      max_disk_gb: 0
      min_duration_days: 0     # host max rental length (days)
      max_duration_days: 0
      min_price_per_hour: 0    # $/h band (0 = open)
      max_price_per_hour: 0
      min_pcie_bw_gbps: 0      # CPU↔GPU PCIe bandwidth (GB/s)
      max_pcie_bw_gbps: 0
      min_gpu_frac: 0          # min GPU fraction; 1.0 = full GPU only
      blocked_countries: ""    # comma-separated ISO codes, e.g. "US,HK"
      pick_best: true          # true = best by quality score; false = cheapest
model:
  allow_hub_download: false
  competition_num_known: 446
  ood_head: true
  # Closed-set 1000-class experiment (src/unknown_clustering.py): when > 0,
  # the 554 collapsed "unknown" identities are recovered by clustering the
  # unlabelled unknown train files and trained as pseudo-classes; the cluster
  # columns are summed back into unknown at output time (output stays 447-way).
  num_unknown_clusters: 0
  unknown_cluster_path: data/processed/unknown_clusters.json
  encoder_config:
    campp:
      freeze_encoder: false
      local_path: weights/campp
      model_id: iic/speech_campplus_sv_en_voxceleb_16k
      pooling_type: identity
      revision: v1.0.2
      unfreeze_last_n_blocks: 0
    ecapa:
      freeze_encoder: false
      local_path: weights/ecapa
      pooling_type: identity
      source: speechbrain/spkrec-ecapa-voxceleb
      unfreeze_last_n_blocks: 0
    eres2net:
      ckpt_name: eres2netv2.ckpt
      freeze_encoder: true
      local_path: weights/eres2net
      pooling_type: identity
      unfreeze_last_n_blocks: 0
    titanet:
      freeze_encoder: true
      local_path: weights/titanet/titanet_large.nemo
      model_id: nvidia/speakerverification_en_titanet_large
      pooling_type: identity
    wavlm:
      base_model: microsoft/wavlm-large
      freeze_feature_extractor: true
      local_path: weights/wavlm_large
      pooling_type: statistical
  encoder_type: campp
  fusion:
    ensemble_method: none
  ood_head_config:
    hidden_dim: 256
  pooling_type: identity
  speaker_head_config:
    arcface:
      embedding_dim: 192
      margin: 0.4
      scale: 30.0
    arcface_subcenter:
      embedding_dim: 192
      margin: 0.3
      scale: 32.0
      sub_centers: 3
    linear:
      hidden_dims: []
  speaker_head_type: arcface_subcenter
  # metric = one 446+k head (legacy hybrid); known = strict 446-way primary
  # head while pseudo labels supervise only OOD/auxiliary metric objectives.
  speaker_target_scope: metric
training:
  # Process-level RNG seed (model init, random crops, augmentation, workers).
  # This is distinct from data.split.seed, which only chooses fold membership.
  seed: 42
  deterministic_algorithms: true
  amp_dtype: fp16
  early_stopping_patience: 15
  ema_decay: 0.999
  ema_enabled: true
  encoder_lr: 3.0e-05
  epochs: 200
  freeze_epochs: 0
  label_smoothing: 0.05
  learning_rate: 0.0003
  loss:
    ood:
      pos_weight: 1.0
      type: bce
      weight: 0.15
    proto:
      decay: 0.9
      enabled: false
      margin: 0.2
      scale: 30.0
      weight: 0.1
      scope: metric
    speaker:
      focal_gamma: 2.0
      label_smoothing: 0.05
      type: ce
      weight: 0.85
  max_grad_norm: 5.0
  min_lr_ratio: 0.05
  ood_grad_norm: 1.0
  ood_loss_weight: 0.15
  ood_pos_weight: 1.0
  schedule: cosine
  speaker_loss_weight: 0.85
  warmup_ratio: 0.1
  weight_decay: 0.0001
