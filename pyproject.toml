[project]
name = "speaker-identification"
version = "0.1.0"
description = "Open-Set Speaker Identification for IAAA 2026 Competition"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click",
    "librosa",
    "matplotlib",
    "pandas",
    "pyyaml",
    "seaborn",
    # Metrics / EDA / centroid baseline rely on these (metrics.py, eda_*.py,
    # centroid_baseline.py) — declared explicitly for fresh Vast.ai installs.
    "scikit-learn",
    "scipy",
    "torch",
    "torchaudio",
    "torchcodec",
    "tqdm",
    # Leaderboard server pins: transformers>=4.57,<4.58 + huggingface-hub>=0.30
    # (see Competition-Guide/leaderbordpakage.txt). The old 4.46.x pin was for
    # WavLM-Large requires the newer transformers too.
    "transformers>=4.57,<4.58",
    "huggingface-hub>=0.30",
    # MLOps & Deployment
    "zenml",
    "mlflow",
    "dagshub",
    "streamlit",
    "python-dotenv",
    "vastai",
    # Data Version Control (for DagsHub S3 remote)
    "dvc",
    "dvc-s3",
    "audiomentations>=0.43.1",
    "speechbrain>=1.0.3,<2.0.0",
    "ruamel-yaml<0.18",
    "faiss-cpu>=1.15.0",
    "sqlalchemy-utils>=0.42.1",
    "sqlmodel>=0.0.39",
    "passlib>=1.7.4",
    "pymysql>=1.2.0",
    # ── Encoder stack (new encoders) ──
    # CAM++ / ERes2NetV2 → ModelScope pipeline (leaderboard has modelscope>=1.38.1)
    "modelscope>=1.38.1,<2.0.0",
    # TitaNet-Large → NeMo (leaderboard has nemo-toolkit[asr]>=2.7.3)
    "nemo-toolkit[asr]>=2.7.3,<3.0.0",
    # ModelScope / NeMo transitive needs + ONNX export path
    "sentencepiece>=0.2.2",
    "datasets>=5.0.0,<6.0.0",
    "onnxruntime>=1.23.2",
    "onnx>=1.22",
    "onnxsim>=0.6.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "black>=24.0.0",
    "ruff>=0.5.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

