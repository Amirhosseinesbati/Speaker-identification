[project]
name = "speaker-identification"
version = "0.1.0"
description = "Open-Set Speaker Identification for IAAA 2026 Competition"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.4.2",
    "librosa>=0.11.0",
    "matplotlib>=3.11.0",
    "pandas>=3.0.3",
    "pyyaml>=6.0.3",
    "seaborn>=0.13.2",
    "torch>=2.13.0",
    "torchaudio>=2.11.0",
    "torchcodec>=0.15.0",
    "tqdm>=4.68.4",
    "transformers>=5.14.1",
    # MLOps & Deployment
    "zenml>=0.70.0,<0.80.0",
    "mlflow>=2.18.0",
    "dagshub>=0.4.0",
    "streamlit>=1.40.0",
    "python-dotenv>=1.1.0",
    "vastai>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "black>=24.0.0",
    "ruff>=0.5.0",
]
